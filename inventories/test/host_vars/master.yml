firewall_ports: [ {port: "179", proto: "tcp"}, {port: "6443", proto: "tcp"}, {port: "2379-2380", proto: "tcp"}, {port: "10250", proto: "tcp"}, {port: "10259", proto: "tcp"}, {port: "10257", proto: "tcp"}, {port: "6783", proto: "tcp"} ]
